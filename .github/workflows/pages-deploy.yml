name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Fix vite executable for CI
        run: chmod +x node_modules/.bin/vite || true

      - name: Verify dist exists
        run: |
          if [ ! -d dist ]; then echo "Missing dist"; exit 1; fi
          ls -l dist || true
          ls -l dist/assets || true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=${{ github.event.repository.name }}
